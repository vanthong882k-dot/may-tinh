<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy Tính Di Động</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
        }
        .calculator {
            width: 100%;
            max-width: 360px; /* Vừa vặn chiều rộng điện thoại */
            background-color: #1c1c1c;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        #screen {
            width: 100%;
            height: 80px;
            background-color: transparent;
            border: none;
            color: #ffffff;
            font-size: 2.5rem;
            text-align: right;
            padding: 10px;
            margin-bottom: 20px;
            outline: none;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        button {
            padding: 20px;
            font-size: 1.5rem;
            border: none;
            border-radius: 50%; /* Nút hình tròn kiểu iOS */
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.1s;
        }
        button:active {
            opacity: 0.7;
        }
        .number {
            background-color: #333333;
            color: white;
        }
        .operator {
            background-color: #ff9f0a;
            color: white;
        }
        .clear {
            background-color: #a5a5a5;
            color: black;
        }
        .equal {
            background-color: #ff9f0a;
            color: white;
        }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="screen" readonly value="0">
    <div class="buttons">
        <button class="clear" onclick="clearScreen()">C</button>
        <button class="number" onclick="appendValue('(')">(</button>
        <button class="number" onclick="appendValue(')')">)</button>
        <button class="operator" onclick="appendValue('/')">/</button>
        
        <button class="number" onclick="appendValue('7')">7</button>
        <button class="number" onclick="appendValue('8')">8</button>
        <button class="number" onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('*')">x</button>
        
        <button class="number" onclick="appendValue('4')">4</button>
        <button class="number" onclick="appendValue('5')">5</button>
        <button class="number" onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('-')">-</button>
        
        <button class="number" onclick="appendValue('1')">1</button>
        <button class="number" onclick="appendValue('2')">2</button>
        <button class="number" onclick="appendValue('3')">3</button>
        <button class="operator" onclick="appendValue('+')">+</button>
        
        <button class="number" style="grid-column: span 2; border-radius: 30px;" onclick="appendValue('0')">0</button>
        <button class="number" onclick="appendValue('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const screen = document.getElementById('screen');

    function appendValue(value) {
        if (screen.value === '0' && !isNaN(value)) {
            screen.value = value;
        } else {
            screen.value += value;
        }
    }

    function clearScreen() {
        screen.value = '0';
    }

    function calculate() {
        try {
            // Thay thế các ký tự hiển thị thành toán tử JavaScript nếu cần và tính toán
            let result = eval(screen.value);
            screen.value = Number(result.toFixed(4)); // Làm tròn tối đa 4 chữ số thập phân
        } catch (error) {
            screen.value = 'Lỗi';
        }
    }
</script>

</body>
</html>
